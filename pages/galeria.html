  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

      <a class="navbar-brand" href="../index.html">
        <img src="../img/akalitattof2.jpg" alt="Logo de Akali Tatto" width="60" class="rounded-circle">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation">

</header>

        <main class="container py-4">
      <!-- Carrusel con animación zoom-in -->
      <section class="mb-5" data-aos="zoom-in">
        <h2>Trabajos del mes</h2>
        <div id="carruselGaleria" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carruselGaleria" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carruselGaleria" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carruselGaleria" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-inner rounded">
            <div class="carousel-item active">
              <img src="../img/galeriarealista.png" class="d-block w-100" alt="Tatuaje floral elegante">
            </div>
            <div class="carousel-item">
              <img src="../img/galeriaMinimalista.png" class="d-block w-100" alt="Arte botánico">
            </div>
            <div class="carousel-item">
              <img src="../img/aguilaindex.jpg" class="d-block w-100" alt="Tatuaje floral tobillo">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carruselGaleria" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carruselGaleria" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </div>
      </section>
      <!-- Galería con animaciones en cada tarjeta/artículo -->
      <section id="galeria">
        <h1 data-aos="fade-down">Nuestra galeria</h1>
        <article data-aos="fade-up" data-aos-delay="100">
          <figure>
            <img
              src="../img/StockCake-Tatuaje_floral_elegante-2505585-medium.jpg"
              alt="tatuaje de flor"
            />
            <figcaption>
              <h2>Flowers</h2>
              <p>Artista: <strong>Mariela Garcia</strong></p>
              <p>Estilo: Tradicional · Pierna</p>
            </figcaption>
          </figure>
        </article>
        <article data-aos="fade-up" data-aos-delay="200">
          <figure>
            <img
              src="../img/StockCake-Arte_botánico_en_el_brazo-2521681-medium.jpg"
              alt="tatuaje botanico"
            />
            <figcaption>
              <h2>Bouquet</h2>
              <p>Artista: <strong>Jose Martin</strong></p>
              <p>Estilo: Minimalista · Brazo</p>
            </figcaption>
          </figure>
        </article>
        <article data-aos="fade-up" data-aos-delay="300">
          <figure>
            <img
              src="../img/StockCake-Tatuaje_floral_en_el_tobillo-1084129-medium.jpg"
              alt="tatuaje floral"
            />
            <figcaption>
              <h2>Sakura</h2>
              <p>Artista: <strong>Sofia Martinez</strong></p>
              <p>Estilo: Japones · Tobillo</p>
            </figcaption>
          </figure>
        </article>
        <article data-aos="fade-up" data-aos-delay="100">
          <figure>
            <img
              src="../img/Tatuaje-realista-Frida-Kahlo.jpeg"
              alt="tatuaje Frida"
            />
            <figcaption>
              <h2>Frida</h2>
              <p>Artista: <strong>Jazmin Carrizo</strong></p>
              <p>Estilo: Realista · Brazo</p>
            </figcaption>
          </figure>
        </article>
        <article data-aos="fade-up" data-aos-delay="200">
          <figure>
            <img src="../img/galeriaLeona.jpg" alt="tatuaje leona">
            <figcaption>
              <h2>Lioness</h2>
              <p>Artista: <strong> Jose Martin</strong></p>
              <p>Estilo: Minimalista · Brazo</p>
            </figcaption>
          </figure>
        </article>
        <article data-aos="fade-up" data-aos-delay="300">
          <figure>
            <img src="../img/tatuajeRealistaDavid.jpg" alt="tatuaje david">
            <figcaption>
              <h2>David</h2>
              <p>Artista: <strong> Jazmin Carrizo</strong></p>
              <p>Estilo: Microrealismo · Brazo</p>
            </figcaption>
          </figure>
        </article>
      </section>
    </main>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 800, // Duración de la animación en milisegundos
    once: true     // Para que la animación ocurra una sola vez al hacer scroll
  });
</script>
